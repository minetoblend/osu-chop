name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "props=-p:Version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "props=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ruleset
        run: |
          dotnet build osu.Game.Rulesets.Chop/osu.Game.Rulesets.Chop.csproj \
            -c Release \
            ${{ steps.version.outputs.props }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            osu.Game.Rulesets.Chop/bin/Release/net8.0/osu.Game.Rulesets.Chop.dll
